executor: slurm
default-resources:
  - mem_mb=4000
  - slurm_account=jonth0
  - slurm_partition=standard
  - runtime=60 # in seconds
max-jobs-per-second: 10
max-status-checks-per-second: 1
jobs: 100
keep-going: True
rerun-incomplete: True
printshellcmds: True
directory: /scratch/jonth_root/jonth0/tdarg/output
# output: /scratch/jonth0/unified_pipeline/output
config: 
  # - data_dir: /mnt/turbo/shared_data/unified
  - data_dir=/nfs/turbo/lsa-jonth/shared_data/unified-tdarg
